<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Photo Showcase</title>
    </head>
    <body>
        <header></header>
        <main>
            <figure>
                <img
                    src="./images/cherry-blossom-image.jpg"
                    alt="Image of Pink Clouds in a Garden"
                    width="500"
                    height="300"
                />
                <figcaption>Pink Clouds in a Garden</figcaption>
            </figure>

            <figure>
                <img
                    src="./images/farm-image.jpg"
                    alt="Farm Scenary Image"
                    width="500"
                    height="300"
                />
                <figcaption>Farms during Summer</figcaption>
            </figure>

            <figure>
                <img
                    src="./images/japan-image.jpg"
                    alt="Japan Image"
                    width="500"
                    height="300"
                />
                <figcaption>Sunrise during the Samurai Era</figcaption>
            </figure>

            <img
                src="./images/night-image.avif"
                alt=""
                width="500"
                height="300"
            />
            <img
                src="./images/purple-image.jpg"
                alt="Image in Purple"
                width="500"
                height="300"
            />
            <img
                src="./images/sunset-image.jpg"
                alt="Sun Setting Image"
                width="500"
                height="300"
            />

            <br />

            <video
                poster="./images/enzo-poster.jpeg"
                controls
                loop
                width="500"
                aria-label="Enzo Fernandes Pushing the Referee"
            >
                <source
                    src="./videos/Enzo-Pushing-Referee.mp4"
                    type="video/mp4"
                />

                <p>
                    Your Browser does not support HTML5 video. You can
                    <a href="./videos/Enzo-Pushing-Referee.mp4"
                        >download the video</a
                    >
                    to watch it offline.
                </p>
            </video>
        </main>
        <footer></footer>
    </body>
</html>
